<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .box{
            width: 300px;
            height: 300px;
            background-color: teal;
        }

    </style>

</head>
<body>

    <div class="box"></div>
    <button class="change_btn">색상 변경</button>
    <button class="reset_btn">원래 색상</button>

    <!-- ------------------------------------------------- -->

    <script>

        const box_el = document.querySelector(".box");
        // =>box_el을 선택함

        const change_el = document.querySelector(".change_btn");
        // =>change_btn을 선택함

        const reset_el = document.querySelector(".reset_btn");

        
        // change_el을 클릭하면 box_el의 배경색상이 변경 
        change_el.addEventListener("click", () => {
            box_el.style.backgroundColor = "yellow";
        });

        // reset_el를 클릭하면 box_el가 원래색상인 teal 색으로 변경
        reset_el.addEventListener("click", () => {
            box_el.style.backgroundColor = "teal";
        });

    </script>
    
</body>
</html>
